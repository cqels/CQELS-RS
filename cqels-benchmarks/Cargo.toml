[package]
name = "cqels-benchmarks"
description = "Benchmarks for the CQELS streaming engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
cqels-model.workspace = true
cqels-core.workspace = true
cqels-engine.workspace = true
cqels-reasoning.workspace = true
cqels-geo.workspace = true
tokio.workspace = true
futures.workspace = true
criterion.workspace = true
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
# Parses each fixture's `static.trig` for the parity benchmark, mirroring the
# Rust parity runner. Uses the workspace dep (RocksDB backend disabled) to
# avoid an oxrocksdb-sys conflict with cqels-storage-rocksdb.
oxigraph.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-stream.workspace = true

[[bench]]
name = "stream_throughput"
harness = false

[[bench]]
name = "reasoning_profiles"
harness = false

[[bench]]
name = "engine_facade"
harness = false

[[bench]]
name = "parallel_operators"
harness = false

[[bench]]
name = "parity_fixtures"
harness = false
