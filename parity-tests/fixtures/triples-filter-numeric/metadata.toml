name = "triples-filter-numeric"
description = """
SELECT with a FILTER(?v > 24) numeric comparison. Six readings
(typed xsd:integer literals) flow through a TRIPLES 3 window,
producing two batches; only readings with `?temp > 24` survive.
Exercises the expression evaluator, FILTER hoisting, and typed
numeric literal comparison. NOTE: the readings are typed
xsd:integer, not bare strings — the engine does NOT numerically
coerce a plain (untyped) literal in a comparison (that would be a
type error / drop, matching Java and the ExpressionEvaluator
parity corpus). Earlier bare-string data + a coercion assumption
was a fixture-authoring error (see cqels-rs#123, closed).
"""
ground_truth = "hand-spec"
