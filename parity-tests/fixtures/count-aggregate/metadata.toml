name = "count-aggregate"
description = """
SELECT with a COUNT aggregate + GROUP BY. SPARQL-correct
expected: one row per distinct ?sensor with the count of
matching events.

**Both engines compute the counts correctly — but cqels-rs's
row order is non-deterministic.** Discovered via
`cargo xtask parity diff`:

- **cqels-rs:** parser accepts the query and execution emits the
  two correct rows (`s1 → 3`, `s2 → 2`). However, repeated runs
  show the row order alternates: roughly 5/8 runs start with s1,
  3/8 start with s2. Root cause is in
  `cqels-core/src/compiler/pipeline.rs::apply_group_by_aggregates`
  — uses a `HashMap` (randomized hash seed) to group, then
  iterates it. Order-sensitive parity comparison therefore
  **flakes** on this fixture. The parity note records the one-line
  fix suggestion: swap the grouping map to `BTreeMap`.
- **cqels-java:** ✅ correct and deterministic. Emits the 2
  expected rows in `(s1, s2)` order every run.

Until cqels-rs's aggregate emission is made deterministic, this
fixture's "Rust" column in the parity matrix is unreliable.
Status flips between `ok` and `FAIL` across runs.
"""
ground_truth = "hand-spec"
drain_timeout_ms = 500
