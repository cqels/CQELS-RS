name = "stream-static-lookup-join"
description = """
Multi-pattern BGP where one pattern is in a STREAM block and the
other matches against a static graph declared via `FROM <iri>`.
Exercises the **stream+static** counterpart to the multi-pattern
STREAM-block bug fixed in cqels/claude#83 — that path goes through
`executeWithLookupJoin` (not `executeWindowedHashJoin`) and was
filed separately as cqels/claude#85.

**Shape:**

```sparql
SELECT ?sensor ?temp ?location
FROM STREAM readings [TRIPLES 4]
FROM <http://ex.org/static/sensors>
WHERE {
  STREAM readings { ?sensor <http://ex.org/temp> ?temp . }
  ?sensor <http://ex.org/location> ?location .
}
```

The static graph carries `?sensor → ?location` mappings for three
sensors (s1=kitchen, s2=lounge, s3=garage). Stream events arrive
for four sensors. Expected behavior: only s1/s2/s3 produce
joined output; s4 has no static location, so its event is
filtered out of the result set.

**Status on the Java side:** cqels/claude#85 was fixed in commit
`2ff2129` "fix(core): compose windowed-hash-join + static lookup
for multi-pattern stream BGPs (#85)" plus follow-up `214390c`
"preserve join key + defer BIND/FILTER for composed
stream+static path" (Codex P1×2 review). The captured
`expected.jsonl` came from a Java run against `2ff2129`.

**Status on the Rust side:** fixed in `acb5480`
(`fix(compiler): execute FROM <iri> -- resolve default patterns against
static graphs`). The compiler now evaluates unscoped default patterns
against the declared `FROM <iri>` graph set, matching the Java-captured
oracle for this fixture.
"""
ground_truth = "java-captured"
