[package]
name = "cqels-parity-runner"
description = "Runs language-neutral parity fixtures against the Rust cqels engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
publish = false

# Declaring an empty [workspace] here makes this crate the root of its
# own workspace, so `cargo test --workspace` at the repo root does not
# pull it in. Build it explicitly from this directory.
[workspace]

[[bin]]
name = "cqels-parity-runner"
path = "src/main.rs"

[dependencies]
cqels-core = { path = "../../cqels-core" }
cqels-engine = { path = "../../cqels-engine" }
cqels-model = { path = "../../cqels-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
similar = "2"
# TriG parsing for fixtures that include a `static.trig` static-graph
# data file. Matches the oxigraph version cqels-core uses; the
# parser API (`oxigraph::io::DatasetParser`) lives in the default
# feature set so no feature flags needed.
oxigraph = "0.4"
oxrdf = "0.2"
