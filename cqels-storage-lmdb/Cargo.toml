[package]
name = "cqels-storage-lmdb"
description = "LMDB-backed persistent storage for CQELS via the `heed` pure-Rust binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
cqels-storage-spi.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
parking_lot.workspace = true
heed = { version = "0.20", default-features = false, features = ["read-txn-no-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
