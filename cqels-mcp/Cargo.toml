[package]
name = "cqels-mcp"
description = "Model Context Protocol (MCP) tool surface for exposing CQELS to LLM agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
cqels-asp.workspace = true
cqels-core.workspace = true
cqels-engine.workspace = true
cqels-model.workspace = true
cqels-reasoning.workspace = true
cqels-shacl.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
sled = "0.34"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
