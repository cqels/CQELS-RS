name: CI

# ──────────────────────────────────────────────────────────────────────
# GitHub-hosted runner triggers are disabled while the HiveIntel org
# Actions account is billing-blocked. Every push / pull_request / cron
# event was being scheduled and then instantly failing with
# "recent account payments have failed or your spending limit needs
# to be increased", which left dozens of red ✗ checks across the PR
# history without ever running any of the jobs.
#
# Local CI is the gate in the meantime — `cargo xtask test pr` runs
# the equivalent fmt + clippy + workspace tests + doc suite, and PR
# descriptions document its results.
#
# To restore GitHub-hosted CI after the billing block clears, put
# back:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#     schedule:
#       - cron: "0 5 * * *"
# ──────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  pr-impact:
    name: PR Impact Suite
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 needed so `cargo xtask test impact --base origin/main`
      # can compute the diff against main. The default shallow checkout
      # (depth=1) leaves origin/main unresolvable on the runner.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test impact --base origin/main

  pr-fast:
    name: Fast Workspace Tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --lib --bins --tests

  deny:
    name: Cargo Deny
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ─── Cross-platform verification (PR-required) ──────────────────────

  test-macos:
    name: Tests (macOS)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-windows:
    name: Tests (Windows)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ─── WASM compilation check (PR-required) ───────────────────────────

  wasm:
    name: WASM Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cqels-model --target wasm32-wasip1

  # ─── Nightly / scheduled jobs ───────────────────────────────────────

  nightly-full:
    name: Full Regression Sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test full

  nightly-coverage:
    name: Coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: target/xtask/coverage

  nightly-msrv:
    name: MSRV (1.83)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude cqels-benchmarks --locked

  nightly-audit:
    name: Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  nightly-bench-compile:
    name: Benchmarks Compile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  nightly-bench-observe:
    name: Benchmarks Observe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.json
          key: bench-baseline-
          restore-keys: bench-baseline-
      - run: cargo xtask bench-observe
      - name: Save current results as baseline for next run
        run: cargo xtask bench-save-baseline
      - name: Persist benchmark baseline
        uses: actions/cache/save@v4
        with:
          path: bench-baseline.json
          key: bench-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            target/criterion
            target/xtask/bench-observe

  # ─── Cross-language parity (nightly) ────────────────────────────────
  #
  # Runs the Java parity runner under `parity-tests/runner-java/`
  # against the same fixtures the Rust runner consumes, so a
  # regression on either side surfaces before main moves on.
  #
  # cqels-java lives in the private repo `cqels/claude` (not on Maven
  # Central), so the job needs a PAT with `repo:read` on that repo
  # exposed as the secret `CQELS_CLAUDE_PAT`. If the secret is unset,
  # the job exits 0 early and prints a notice — that keeps the
  # workflow green for forks / contributors who don't have access to
  # cqels/claude, which is intentional.
  #
  # Today's 7 fixtures split into:
  #   • 4 known-passing on cqels-java   → enforced (any regression fails the job)
  #   • 3 known-failing on cqels-java   → run informationally, never fail the job
  # The "informational" set is uploaded as a log artifact for visibility.
  # When a delta is reconciled (fixture flipped to java-golden, or the
  # underlying engine bug fixed), move its name from `parity_java_known_failing`
  # to `parity_java_known_passing` here.
  nightly-parity-java:
    name: Parity Java Runner
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Keep these two lists in sync with the matrix in
      # `parity-tests/runner-java/README.md`.
      parity_java_known_passing: >-
        simple-select-now
        range-window-low-volume
        triples-filter-numeric
        triples-window-batch
        order-by-limit
        count-aggregate
    steps:
      - uses: actions/checkout@v4

      - name: Check CQELS_CLAUDE_PAT secret
        id: secret_check
        env:
          PAT: ${{ secrets.CQELS_CLAUDE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Parity Java skipped::CQELS_CLAUDE_PAT not set; provision a repo-read PAT on cqels/claude to enable this job."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.secret_check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clone + install cqels/claude into local Maven repo
        if: steps.secret_check.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.CQELS_CLAUDE_PAT }}
        run: |
          set -euo pipefail
          git clone --depth=1 "https://x-access-token:${PAT}@github.com/cqels/claude.git" "${RUNNER_TEMP}/cqels-claude"
          ( cd "${RUNNER_TEMP}/cqels-claude" && mvn -q -B -DskipTests install )

      - name: Build runner-java + JMH uber-jar
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        run: mvn -q -B -DskipTests package

      - name: Run known-passing fixtures (regression gate)
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        run: |
          set -euo pipefail
          JAR=$(ls target/cqels-parity-runner-java-*-jar-with-dependencies.jar)
          for f in $parity_java_known_passing; do
            echo "::group::$f"
            java -jar "$JAR" "../fixtures/$f"
            echo "::endgroup::"
          done

      - name: Run all fixtures (informational, never fails the job)
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        continue-on-error: true
        run: |
          set -uo pipefail
          JAR=$(ls target/cqels-parity-runner-java-*-jar-with-dependencies.jar)
          java -jar "$JAR" --all ../fixtures 2>&1 | tee parity-java-full.log
          # Always exit 0 — known-failing fixtures are tracked here for
          # visibility, not as a regression gate.
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.secret_check.outputs.skip != 'true'
        with:
          name: parity-java-log
          path: parity-tests/runner-java/parity-java-full.log
