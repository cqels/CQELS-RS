name: CI

# ──────────────────────────────────────────────────────────────────────
# CI compute layout (HiveIntel Actions account is billing-blocked):
#
#   • PR-required jobs run on a self-hosted runner labelled
#     [self-hosted, cqels-local] — a Mac registered to this repo.
#     They fire on push / pull_request just like normal CI.
#
#   • test-windows + nightly jobs still target GitHub-hosted runners
#     (`windows-latest`, `ubuntu-latest`). They are gated to
#     workflow_dispatch only so they stay dormant — manually
#     dispatching them after the billing block clears is enough to
#     restore the full matrix without another workflow edit.
#
# Local pre-push hook (`cargo xtask test pr`) is still the first
# gate; the self-hosted runner is the second, identical pipeline.
# ──────────────────────────────────────────────────────────────────────
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_ref:
        description: >-
          Optional. Pass `refs/pull/<N>/head` to make actions/checkout fetch
          the fork's actual head SHA on the self-hosted runner — useful for
          maintainer eyes-on validation of fork-PR code before merging.
          NOTE: GitHub attaches dispatch check runs to the dispatched
          branch's SHA, not the PR head, so this DOES NOT update the PR's
          required-check status. Fully automating fork-PR validation
          requires the Checks API — out of scope for this PR. See
          comments above.
        required: false
        type: string
        default: ''

# Cancel in-progress runs for the same source branch on the same source
# repository, so:
#   - push + pull_request:synchronize on the same commit share one
#     cancellation group;
#   - a fork PR opened from a branch with the same name as one in this
#     repo (e.g. `main`) does NOT cancel our in-progress push runs.
#
# `github.ref` differs between events on the same head (push:
# refs/heads/<b>, PR sync: refs/pull/<n>/merge). Keying on
# `head_ref || ref_name` makes both events on the same branch share a
# group. Prefixing the head repo (or this repo, on push) keeps a fork
# PR's group distinct from ours even when branch names collide
# (codex review on cqels-rs#77, P2).
concurrency:
  # Key includes:
  #   event_name — keep push and pull_request runs on the same commit in
  #     separate groups. push validates the head ref directly; PR validates
  #     the merge commit. Sharing a group would let a later push cancel
  #     the merge-commit validation (codex round-4 P2 on cqels-rs#77).
  #   head repo  — fork PRs get their own group even when the branch
  #     name collides with one in this repo (round-3 P2).
  #   branch     — head_ref on PR / ref_name on push: stable across
  #     synchronize and re-pushes to the same branch.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Fork-PR safety gate (P1, codex review on PR #77):
  # Self-hosted runner is a persistent machine on the maintainer's workstation,
  # not an ephemeral GitHub-hosted VM. A PR from a fork could push arbitrary
  # code that would execute on that machine. Block fork PRs from the
  # self-hosted runner — push events from inside this repo, PR events
  # whose head repo == this repo, and workflow_dispatch all pass.
  #
  # External-fork PRs to this repo would need either:
  #   - GitHub-hosted CI restored (after billing block clears), OR
  #   - a maintainer to re-run after review via workflow_dispatch.
  #
  # ── Required-check semantics (codex P1 follow-up, round 3) ────────
  # GitHub treats a job skipped via job-level `if:` as `success` for
  # required-status purposes. For fork PRs the existing PR-required
  # jobs (fmt, clippy, …) all skip — appearing green to branch
  # protection. The blockers below each share a `name:` with one of
  # the real PR-required jobs, so for fork PRs GitHub sees the named
  # required check as: [real job: skipped=success] + [blocker:
  # failure]. Any failure under a required-check name fails the
  # whole required check.
  #
  # ── Known limitation: fork-PR re-validation ───────────────────────
  # Once a fork PR is blocked here, the `pr_ref` workflow_dispatch
  # input lets a maintainer fetch the fork head to the self-hosted
  # runner for eyes-on validation, but GitHub attaches dispatch
  # check runs to the dispatched branch's SHA — not to the PR head.
  # So the PR's required-check status stays failed even after a
  # manual run. Fully automating this requires the GitHub Checks API
  # (POST /repos/{owner}/{repo}/check-runs with head_sha = PR head)
  # which is deferred as a follow-up since the repo currently has
  # no fork-PR workflow in flight. The cleanest long-term resolution
  # is restoring GitHub-hosted CI (the original ubuntu-latest path).
  #
  # Why 8 explicit jobs and not a `matrix:` — when an `if:` at job
  # level evaluates false (the same-repo case), GitHub does NOT
  # expand the matrix, leaving the unsubstituted `${{ matrix.x }}`
  # template as the check run name. Per-name blocker jobs sidestep
  # that quirk and give one clearly-named skipped check per existing
  # required job on the same-repo path.
  fork-pr-blocker-fmt:
    name: Format
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-clippy:
    name: Clippy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-doc:
    name: Documentation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-pr-impact:
    name: PR Impact Suite
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-pr-fast:
    name: Fast Workspace Tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-deny:
    name: Cargo Deny
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-test-macos:
    name: Tests (macOS)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }
  fork-pr-blocker-wasm:
    name: WASM Check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - { run: 'echo "::error::Fork PR is blocked from the self-hosted runner. Fully automated fork-PR validation needs the Checks API (deferred follow-up). For now: restore GitHub-hosted CI, or eyes-on review the fork commits manually." && exit 1' }

  # timeout-minutes on every self-hosted job: this is a SINGLE runner, so a
  # hung job would otherwise hold it for GitHub's 6-hour default and block all
  # other queued jobs. The caps below are ~2x the observed warm-cache runtime.
  fmt:
    name: Format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  pr-impact:
    name: PR Impact Suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 40
    steps:
      # fetch-depth: 0 needed so `cargo xtask test impact --base origin/main`
      # can compute the diff against main. The default shallow checkout
      # (depth=1) leaves origin/main unresolvable on the runner.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test impact --base origin/main

  pr-fast:
    name: Fast Workspace Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --lib --bins --tests

  deny:
    name: Cargo Deny
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      # cargo-deny shells out to `cargo metadata` to resolve the dep graph,
      # so it needs cargo on PATH even though the binary is self-contained
      # for its own parsing. Install rust here too.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo-deny check

  # ─── Cross-platform verification (PR-required) ──────────────────────

  test-macos:
    name: Tests (macOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Windows coverage is dormant until the GitHub-hosted billing block
  # clears. Trigger manually via `gh workflow run CI --ref <branch>` to
  # re-run it once billing is restored.
  test-windows:
    name: Tests (Windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ─── WASM compilation check (PR-required) ───────────────────────────

  wasm:
    name: WASM Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cqels-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cqels-model --target wasm32-wasip1

  # ─── Nightly / scheduled jobs ───────────────────────────────────────

  nightly-full:
    name: Full Regression Sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test full

  nightly-coverage:
    name: Coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: target/xtask/coverage

  nightly-msrv:
    name: MSRV (1.85)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude cqels-benchmarks --locked

  nightly-audit:
    name: Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  nightly-bench-compile:
    name: Benchmarks Compile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  nightly-bench-observe:
    name: Benchmarks Observe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.json
          key: bench-baseline-
          restore-keys: bench-baseline-
      - run: cargo xtask bench-observe
      - name: Save current results as baseline for next run
        run: cargo xtask bench-save-baseline
      - name: Persist benchmark baseline
        uses: actions/cache/save@v4
        with:
          path: bench-baseline.json
          key: bench-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            target/criterion
            target/xtask/bench-observe

  # ─── Cross-language parity (nightly) ────────────────────────────────
  #
  # Runs the Java parity runner under `parity-tests/runner-java/`
  # against the same fixtures the Rust runner consumes, so a
  # regression on either side surfaces before main moves on.
  #
  # cqels-java lives in the private repo `cqels/claude` (not on Maven
  # Central), so the job needs a PAT with `repo:read` on that repo
  # exposed as the secret `CQELS_CLAUDE_PAT`. If the secret is unset,
  # the job exits 0 early and prints a notice — that keeps the
  # workflow green for forks / contributors who don't have access to
  # cqels/claude, which is intentional.
  #
  # Today's 7 fixtures split into:
  #   • 4 known-passing on cqels-java   → enforced (any regression fails the job)
  #   • 3 known-failing on cqels-java   → run informationally, never fail the job
  # The "informational" set is uploaded as a log artifact for visibility.
  # When a delta is reconciled (fixture flipped to java-golden, or the
  # underlying engine bug fixed), move its name from `parity_java_known_failing`
  # to `parity_java_known_passing` here.
  nightly-parity-java:
    name: Parity Java Runner
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Keep these two lists in sync with the matrix in
      # `parity-tests/runner-java/README.md`.
      parity_java_known_passing: >-
        simple-select-now
        range-window-low-volume
        triples-filter-numeric
        triples-window-batch
        order-by-limit
        count-aggregate
        stream-static-lookup-join
    steps:
      - uses: actions/checkout@v4

      - name: Check CQELS_CLAUDE_PAT secret
        id: secret_check
        env:
          PAT: ${{ secrets.CQELS_CLAUDE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Parity Java skipped::CQELS_CLAUDE_PAT not set; provision a repo-read PAT on cqels/claude to enable this job."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.secret_check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clone + install cqels/claude into local Maven repo
        if: steps.secret_check.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.CQELS_CLAUDE_PAT }}
        run: |
          set -euo pipefail
          git clone --depth=1 "https://x-access-token:${PAT}@github.com/cqels/claude.git" "${RUNNER_TEMP}/cqels-claude"
          ( cd "${RUNNER_TEMP}/cqels-claude" && mvn -q -B -DskipTests install )

      - name: Build runner-java + JMH uber-jar
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        run: mvn -q -B -DskipTests package

      - name: Run known-passing fixtures (regression gate)
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        run: |
          set -euo pipefail
          JAR=$(ls target/cqels-parity-runner-java-*-jar-with-dependencies.jar)
          for f in $parity_java_known_passing; do
            echo "::group::$f"
            java -jar "$JAR" "../fixtures/$f"
            echo "::endgroup::"
          done

      - name: Run all fixtures (informational, never fails the job)
        if: steps.secret_check.outputs.skip != 'true'
        working-directory: parity-tests/runner-java
        continue-on-error: true
        run: |
          set -uo pipefail
          JAR=$(ls target/cqels-parity-runner-java-*-jar-with-dependencies.jar)
          java -jar "$JAR" --all ../fixtures 2>&1 | tee parity-java-full.log
          # Always exit 0 — known-failing fixtures are tracked here for
          # visibility, not as a regression gate.
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.secret_check.outputs.skip != 'true'
        with:
          name: parity-java-log
          path: parity-tests/runner-java/parity-java-full.log
