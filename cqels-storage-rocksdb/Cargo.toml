[package]
name = "cqels-storage-rocksdb"
description = "RocksDB-backed persistent storage for CQELS (mirrors Java's cqels-storage-rocksdb)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
cqels-storage-spi.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
parking_lot.workspace = true
# Plain `rocksdb` crate. This only works because we disabled
# oxigraph's `rocksdb` default feature in the workspace root
# (otherwise oxigraph's transitive `oxrocksdb-sys` would claim the
# `links = "rocksdb"` slot and Cargo would refuse to build).
rocksdb = "0.24"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
